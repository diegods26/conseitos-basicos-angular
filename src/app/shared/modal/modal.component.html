<h2 mat-dialog-title>Remover Usuário</h2>
<mat-dialog-content>
  Confima a remoção do cadastro do usuario: {{ data.nome }}?
</mat-dialog-content>
<mat-dialog-actions>
  <button
    class="btn btn-secondary me-2"
    mat-dialog-close
    (click)="cancel()"
  >
    Cancelar
  </button>
  <button
    class="btn btn-primary"
    mat-dialog-close
    cdkFocusInitial
    (click)="confirm()"
  >
    Remover
  </button>
</mat-dialog-actions>
